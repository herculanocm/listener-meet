name: testes

on: [push, pull_request]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências dos testes de lógica (plataforma simulada; sem áudio nem Qt)
        run: python -m pip install --upgrade pip && pip install numpy scipy soundfile pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
