name: testes

on: [push, pull_request]

jobs:
  pytest:
    # Lógica com a plataforma simulada, em três sistemas e nas duas versões de Python que o piso permite (CP17, M-28)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliotecas de sistema (Linux): PortAudio para o sounddevice e as do Qt para o PySide6 em modo offscreen
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Instala o pacote com o extra de desenvolvimento
        run: python -m pip install --upgrade pip && pip install -e .[dev]
      - run: ruff check .
      - name: mypy (plataforma do runner)
        run: mypy
      - name: mypy como Windows (platform/win32 verificado em todo runner)
        run: mypy --platform win32
      - name: pytest (os testes de interface só rodam com QT_QPA_PLATFORM definido)
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  llm:
    # F3: uma célula com os SDKs de LLM (`.[dev,llm]`) para os testes de contrato dos adaptadores; as demais pulam por importorskip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install --upgrade pip && pip install -e .[dev,llm]
      - run: python -m pytest -q tests/test_llm_adapters.py tests/test_llm_core.py -v
        env:
          QT_QPA_PLATFORM: offscreen
          LISTENER_SDK_TESTS: "1"

  interface:
    # Telas com pytest-qt em modo offscreen num só Ubuntu (M-28); a matriz acima já as roda onde o Qt carrega
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install --upgrade pip && pip install -e .[dev]
      - run: python -m pytest -q tests/test_ui.py -v
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "0"
